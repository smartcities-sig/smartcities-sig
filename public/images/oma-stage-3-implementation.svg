<text x="476" y="204" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >One shared question set for every</text>
<text x="476" y="234" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >ecosystem: OMA devices, Smart Data</text>
<text x="476" y="264" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >Models and Digital Twins.</text>
