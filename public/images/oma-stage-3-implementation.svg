<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 956" width="1700" height="956" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How we implement Stage 3: the OMA LwM2M example</title>
<desc id="d">Stage 3 process for OMA LwM2M and Public Lighting: start from the city's needs (14 capabilities), ask every ecosystem the same questions, check the OMA catalogue resource by resource (draft) and capability by capability, then report back to OMA and to Stage 4. Public Lighting result: 6 capabilities covered today, 6 partly covered, 1 needs a new OMA capability, 1 belongs to other systems.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5160"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d2433" flood-opacity=".10"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e3e7ee"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c4cad6" stroke-width="4"/></pattern></defs>
