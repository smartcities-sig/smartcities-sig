<text x="932" y="143" font-size="16" font-weight="700" fill="#fff" text-anchor="start" >CHECK OMA&#x27;S CATALOGUE</text>
<text x="896" y="204" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >Two complementary checks:</text>
