<text x="1316" y="204" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >Recommendations to the OMA Smart</text>
<text x="1316" y="234" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >Cities Working Group, and input to</text>
<text x="1316" y="264" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >Stage 4: Smart Data Models.</text>
