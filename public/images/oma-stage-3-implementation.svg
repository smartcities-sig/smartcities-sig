<text x="92" y="143" font-size="16" font-weight="700" fill="#fff" text-anchor="start" >START FROM THE CITY&#x27;S NEEDS</text>
<text x="56" y="204" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >14 capabilities in 4 categories describe</text>
<text x="56" y="234" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >what the city needs to know (Stage 2),</text>
<text x="56" y="264" font-size="16" font-weight="400" fill="#3c4658" text-anchor="start" >plus the city&#x27;s lighting questions.</text>
<path d="M416 210.0 L442 210.0" fill="none" stroke="#4a5160" stroke-width="4" marker-end="url(#ah)"/>
<rect x="450" y="112" width="380" height="196" rx="10" fill="#fff" stroke="#5b3fb5" stroke-opacity=".45" stroke-width="2" filter="url(#sh)"/>
<path d="M450 162 V122 a10 10 0 0 1 10 -10 H820 a10 10 0 0 1 10 10 V162 z" fill="#5b3fb5"/>
